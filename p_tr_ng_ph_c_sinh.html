<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đập Trứng Phục Sinh</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body, html {
            margin: 0; padding: 0; height: 100%; font-family: 'Nunito', sans-serif;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header {
            text-align: center; padding: 20px; color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 3rem; margin: 0; font-weight: 900; }
        .eggs-container {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            padding: 40px 20px; max-width: 900px; margin: 0 auto;
        }
        .egg {
            width: 100px; height: 130px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            cursor: pointer; position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset -10px -10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, filter 0.3s;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 900; color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .egg:hover { transform: scale(1.1) rotate(-5deg); filter: brightness(1.2); }
        .egg.completed {
            background: none; box-shadow: none; font-size: 4rem; text-shadow: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        
        /* Modal / Question Board - NỀN TRẮNG CHỮ ĐEN DỄ NHÌN */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 100;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-content {
            background: #ffffff; /* Nền trắng tinh */
            color: #000000; /* Chữ màu đen */
            padding: 40px; border-radius: 25px; max-width: 650px; width: 90%;
            text-align: center; position: relative;
            border: 4px solid #000000; /* Viền đen mạnh mẽ */
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transform: scale(0.8); transition: transform 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 2rem;
            cursor: pointer; color: #000000; font-weight: bold; transition: 0.2s;
        }
        .close-btn:hover { color: #ff0000; }
        
        .modal-content h2 { color: #000000; font-size: 2.2rem; margin-top: 0; text-transform: uppercase; font-weight: 900; }
        
        .question-text { font-size: 1.3rem; margin-bottom: 30px; line-height: 1.6; font-weight: bold; color: #000000; }
        
        /* Answers grid */
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Nút đáp án */
        .answer-btn {
            background: #ffffff; /* Nền trắng */
            color: #000000; /* Chữ đen */
            border: 2px solid #000000; /* Viền đen sắc nét */
            padding: 15px 20px; border-radius: 15px; font-size: 1.2rem;
            cursor: pointer; font-weight: bold; transition: all 0.2s;
            display: flex; align-items: center; justify-content: flex-start; gap: 10px;
        }
        .answer-btn:hover:not(:disabled) {
            background: #f0f0f0; transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .answer-label {
            background: #000000; color: #ffffff; width: 30px; height: 30px;
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0; font-weight: bold;
        }
        
        /* Trạng thái đúng sai */
        .answer-btn.correct { background: #2ed573 !important; color: white !important; border-color: #2ed573 !important; }
        .answer-btn.correct * { color: white !important; }
        .answer-btn.wrong { background: #ff4757 !important; color: white !important; border-color: #ff4757 !important; }
        .answer-btn.wrong * { color: white !important; }
        
        .answer-btn.wrong .answer-label { background: rgba(255,255,255,0.3); }
        .answer-btn.correct .answer-label { background: rgba(255,255,255,0.3); }
        .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s; }
        
        /* CSS Toán học tự chế tương thích màu đen */
        .math-inline { display: inline-block; white-space: nowrap; margin: 0 4px; font-style: italic; font-family: "Times New Roman", Times, serif; color: #000000; }
        .math-vector {
            position: relative; display: inline-block; padding-top: 8px; color: #000000; font-weight: bold;
        }
        .math-vector::after {
            content: "→"; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            font-size: 14px; font-style: normal; color: #000000; /* Mũi tên đen */
        }
        .math-sqrt {
            display: inline-block; position: relative; padding-left: 14px; border-top: 1.5px solid #000000; padding-top: 1px; margin-left: 2px; color: #000000;
        }
        .math-sqrt::before {
            content: "√"; position: absolute; left: -2px; top: -1px; font-size: 1.2em; font-style: normal; line-height: 1; color: #000000;
        }
        .math-frac {
            display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.9em; line-height: 1.2; margin: 0 4px; color: #000000;
        }
        .math-frac span:first-child { border-bottom: 1.5px solid #000000; padding: 0 2px; }
        .math-frac span:last-child { padding: 0 2px; }
        .math-abs {
            border-left: 1.5px solid #000000; border-right: 1.5px solid #000000; padding: 0 3px; color: #000000;
        }
        
        /* Pháo hoa Canvas */
        #canvas-confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        
        /* Nút tải về */
        .download-btn {
            position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9);
            color: #333; padding: 10px 20px; border-radius: 30px; font-weight: bold;
            text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .download-btn:hover { background: #fff; transform: translateY(-2px); }
        
        /* Nút chơi tiếp */
        .next-btn {
            display: none; margin: 25px auto 0; padding: 12px 30px; background: #3498db;
            color: white; border: none; border-radius: 20px; font-size: 1.1rem; cursor: pointer;
            font-weight: bold; font-family: 'Nunito', sans-serif; transition: background 0.3s;
        }
        .next-btn:hover { background: #2980b9; }
        
        @media (max-width: 600px) {
            .answers-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🥚 ĐẬP TRỨNG PHỤC SINH 🥚</h1>
    <p>Chọn câu hỏi và giành thật nhiều cúp nhé!</p>
</div>

<div class="eggs-container" id="eggs-container">
    <!-- JS sẽ tạo 5 quả trứng vào đây -->
</div>

<canvas id="canvas-confetti"></canvas>

<a href="#" class="download-btn" id="downloadBtn">⬇️ Tải về Offline</a>

<div class="modal-overlay" id="modal">
    <div class="modal-content" id="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h2 id="q-title">QUẢ TRỨNG SỐ 1</h2>
        <div class="question-text" id="q-text">
            <!-- Nội dung câu hỏi -->
        </div>
        <div class="answers-grid" id="q-answers">
            <!-- Các nút đáp án -->
        </div>
        <button class="next-btn" id="next-btn" onclick="closeModal()">Quay lại & Chọn phần quà khác</button>
    </div>
</div>

<script>
    const questions = [
        {
            id: 1,
            html: `Cho hai vectơ <span class="math-inline math-vector">a</span> và <span class="math-inline math-vector">b</span>. Biết <span class="math-inline math-abs"><span class="math-vector">a</span></span> = 2, <span class="math-inline math-abs"><span class="math-vector">b</span></span> = <span class="math-sqrt">3</span> và (<span class="math-inline math-vector">a</span>, <span class="math-inline math-vector">b</span>) = 30&deg;.<br>Tính <span class="math-inline math-abs"><span class="math-vector">a</span> + <span class="math-vector">b</span></span>.`,
            answers: [
                { html: `<span class="math-sqrt">11</span>`, correct: false },
                { html: `<span class="math-sqrt">13</span>`, correct: true },
                { html: `<span class="math-sqrt">12</span>`, correct: false },
                { html: `<span class="math-sqrt">14</span>`, correct: false }
            ]
        },
        {
            id: 2,
            html: `Cho tam giác ABC vuông cân tại A, có AB = a. Tính tích vô hướng <span class="math-inline math-vector">BA</span>.<span class="math-inline math-vector">BC</span>.`,
            answers: [
                { html: `a<sup>2</sup>`, correct: true },
                { html: `<div class="math-frac"><span>a<sup>2</sup></span><span>2</span></div>`, correct: false },
                { html: `- <div class="math-frac"><span>a<sup>2</sup></span><span>2</span></div>`, correct: false },
                { html: `-a<sup>2</sup>`, correct: false }
            ]
        },
        {
            id: 3,
            html: `Cho tam giác ABC có góc ABC = 30&deg;, AB = 5, BC = 8. Tính <span class="math-inline math-vector">BA</span>.<span class="math-inline math-vector">BC</span>.`,
            answers: [
                { html: `20`, correct: false },
                { html: `20<span class="math-sqrt">3</span>`, correct: true },
                { html: `20<span class="math-sqrt">2</span>`, correct: false },
                { html: `40<span class="math-sqrt">3</span>`, correct: false }
            ]
        },
        {
            id: 4,
            html: `Cho hình vuông ABCD cạnh 2a. Khi đó <span class="math-inline math-vector">AB</span>.<span class="math-inline math-vector">AC</span> bằng:`,
            answers: [
                { html: `4a<sup>2</sup>`, correct: true },
                { html: `a<sup>2</sup><span class="math-sqrt">2</span>`, correct: false },
                { html: `<div class="math-frac"><span><span class="math-sqrt">2</span></span><span>2</span></div> a<sup>2</sup>`, correct: false },
                { html: `a<sup>2</sup>`, correct: false }
            ]
        },
        {
            id: 5,
            html: `Cho tam giác vuông cân ABC có AB = AC = a. Tính <span class="math-inline math-vector">AB</span>.<span class="math-inline math-vector">AC</span>.`,
            answers: [
                { html: `a<sup>2</sup>`, correct: false },
                { html: `<div class="math-frac"><span>-a<sup>2</sup></span><span>2</span></div>`, correct: false },
                { html: `0`, correct: true },
                { html: `<div class="math-frac"><span>a<sup>2</sup><span class="math-sqrt">3</span></span><span>2</span></div>`, correct: false }
            ]
        }
    ];

    const eggColors = [
        'linear-gradient(135deg, #FF9A9E, #FECFEF)',
        'linear-gradient(135deg, #a18cd1, #fbc2eb)',
        'linear-gradient(135deg, #84fab0, #8fd3f4)',
        'linear-gradient(135deg, #fccb90, #d57eeb)',
        'linear-gradient(135deg, #e0c3fc, #8ec5fc)'
    ];

    let currentQuestionIndex = -1;
    let completedQuestions = [];

    // Khởi tạo trứng
    const container = document.getElementById('eggs-container');
    questions.forEach((q, index) => {
        const egg = document.createElement('div');
        egg.className = 'egg';
        egg.style.background = eggColors[index];
        egg.innerHTML = index + 1;
        egg.onclick = () => openQuestion(index, egg);
        container.appendChild(egg);
    });

    const modal = document.getElementById('modal');
    const nextBtn = document.getElementById('next-btn');

    function openQuestion(index, eggElement) {
        if(completedQuestions.includes(index)) return; // Đã xong thì ko mở lại
        currentQuestionIndex = index;
        const q = questions[index];
        
        document.getElementById('q-title').innerText = `QUẢ TRỨNG SỐ ${index + 1}`;
        document.getElementById('q-text').innerHTML = q.html;
        
        const answersDiv = document.getElementById('q-answers');
        answersDiv.innerHTML = '';
        
        const labels = ['A', 'B', 'C', 'D'];
        q.answers.forEach((ans, i) => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.innerHTML = `<span class="answer-label">${labels[i]}</span> ${ans.html}`;
            btn.onclick = () => checkAnswer(btn, ans.correct, index, eggElement);
            answersDiv.appendChild(btn);
        });
        
        nextBtn.style.display = 'none';
        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    function checkAnswer(btn, isCorrect, qIndex, eggElement) {
        const allBtns = document.querySelectorAll('.answer-btn');
        
        if (isCorrect) {
            btn.classList.add('correct');
            btn.innerHTML = btn.innerHTML.replace(/<span.*?<\/span>/, '<span class="answer-label">✓</span>');
            
            // Khóa các nút khác
            allBtns.forEach(b => {
                b.disabled = true;
                if(b !== btn) b.style.opacity = '0.4';
            });
            
            // Hiệu ứng pháo hoa
            fireworks();
            
            // Chuyển trứng thành cúp
            completedQuestions.push(qIndex);
            setTimeout(() => {
                eggElement.className = 'egg completed';
                eggElement.innerHTML = '🏆';
                eggElement.style.background = 'none';
                nextBtn.style.display = 'block';
            }, 500);
        } else {
            btn.classList.add('wrong');
            btn.classList.add('shake');
            btn.innerHTML = btn.innerHTML.replace(/<span.*?<\/span>/, '<span class="answer-label">✗</span>');
            btn.disabled = true;
            setTimeout(() => btn.classList.remove('shake'), 400);
        }
    }

    // ---------- PHÁO HOA TỰ CODE ----------
    const canvas = document.getElementById('canvas-confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    let particles = [];
    const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];

    function createParticles(x, y) {
        let particleCount = 100;
        while(particleCount--) {
            particles.push({
                x: x,
                y: y,
                r: Math.random() * 6 + 2,
                dx: Math.random() * 10 - 5,
                dy: Math.random() * -10 - 5,
                gravity: 0.3,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: Math.random() * 0.5 + 0.5
            });
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i = 0; i < particles.length; i++) {
            let p = particles[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            
            p.x += p.dx;
            p.y += p.dy;
            p.dy += p.gravity;
            p.life -= 0.01;
            
            if(p.life <= 0 || p.y > canvas.height) {
                particles.splice(i, 1);
                i--;
            }
        }
    }
    animate();

    function fireworks() {
        createParticles(window.innerWidth / 2, window.innerHeight / 2 + 100);
        setTimeout(() => createParticles(window.innerWidth / 4, window.innerHeight / 2), 200);
        setTimeout(() => createParticles(window.innerWidth * 3 / 4, window.innerHeight / 2), 400);
    }

    // Tính năng Download tự code
    const downloadBtn = document.getElementById('downloadBtn');
    downloadBtn.onclick = (e) => {
        e.preventDefault();
        const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], {type: 'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dap_trung_phuc_sinh.html';
        a.click();
        URL.revokeObjectURL(url);
    };
</script>
</body>
</html>
